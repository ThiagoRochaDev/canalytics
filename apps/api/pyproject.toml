[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "canalytics-api"
version = "0.1.0"
description = "Portable analytics and connector runtime for Canalytics"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "cryptography>=44,<47"]

[tool.setuptools.packages.find]
where = ["."]
include = ["canalytics*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
